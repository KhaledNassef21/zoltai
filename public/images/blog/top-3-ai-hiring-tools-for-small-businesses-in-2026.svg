<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="360" fill="#6d28d9" opacity="0.16"/>
  <circle cx="512" cy="500" r="270" fill="#8b5cf6" opacity="0.10"/>

  <!-- three candidates -->
  <g>
    <circle cx="330" cy="640" r="40" fill="#a78bfa"/>
    <path d="M252 800 a78 60 0 0 1 156 0 z" fill="#a78bfa"/>
    <circle cx="694" cy="640" r="40" fill="#a78bfa"/>
    <path d="M616 800 a78 60 0 0 1 156 0 z" fill="#a78bfa"/>
    <circle cx="512" cy="620" r="46" fill="#fb7185"/>
    <path d="M424 800 a88 66 0 0 1 176 0 z" fill="#fb7185"/>
    <circle cx="512" cy="620" r="58" fill="none" stroke="#fecdd3" stroke-width="6" opacity="0.85"/>
  </g>

  <!-- magnifying glass -->
  <g>
    <g transform="translate(611 479) rotate(45)">
      <rect x="-21" y="-8" width="42" height="180" rx="18" fill="url(#ring)"/>
    </g>
    <circle cx="512" cy="380" r="140" fill="url(#lens)"/>
    <circle cx="512" cy="380" r="140" fill="none" stroke="url(#ring)" stroke-width="32"/>
    <g stroke="#ddd6fe" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.95">
      <path d="M442 340 h48 l20 -24 h44"/>
      <path d="M448 420 h40 l18 22 h52"/>
      <path d="M512 306 v36"/>
      <path d="M556 448 l22 -28 v-44"/>
      <path d="M470 452 l16 -20"/>
    </g>
    <g fill="#f5f3ff">
      <circle cx="442" cy="340" r="8"/>
      <circle cx="554" cy="316" r="8"/>
      <circle cx="448" cy="420" r="8"/>
      <circle cx="558" cy="442" r="8"/>
      <circle cx="512" cy="306" r="8"/>
      <circle cx="578" cy="376" r="8"/>
      <circle cx="470" cy="452" r="8"/>
    </g>
  </g>
</svg>
